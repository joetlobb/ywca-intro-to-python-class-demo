<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro to Python — YWCA Learning Center</title>
  <script src="client.js"></script>
  <style>
    :root {
      --accent: #1f4e5f;
      --bg: #f7f7f5;
      --border: #cccccc;
    }
    body {
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 20px 80px;
      line-height: 1.5;
      color: #222;
      background: var(--bg);
    }
    h1 { color: var(--accent); font-size: 1.6rem; margin-bottom: 4px; }
    .subtitle { color: #555; margin-top: 0; margin-bottom: 28px; }

    .client-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 28px;
    }
    .client-panel input {
      font-size: 1rem;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 200px;
      margin-right: 8px;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn.secondary {
      background: #fff;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn:hover { opacity: 0.9; }
    .client-note {
      font-size: 0.85rem;
      color: #666;
      margin-top: 8px;
    }

    .topic-grid {
      display: grid;
      gap: 14px;
    }
    .topic-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .topic-card.disabled { opacity: 0.55; }
    .topic-title { font-weight: bold; margin: 0 0 2px; }
    .topic-subtitle { margin: 0; color: #555; font-size: 0.92rem; }
    .status {
      font-size: 0.8rem;
      margin-top: 6px;
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .status.complete { background: #e3f3e6; color: #1e7a34; }
    .status.not-started { background: #eee; color: #666; }
    .open-link {
      white-space: nowrap;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .open-link.disabled {
      background: #ccc;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <h1>Intro to Python</h1>
  <p class="subtitle">YWCA Learning Center &mdash; pick a topic based on what you'd like to learn today.</p>

  <div class="client-panel" id="client-panel"></div>

  <div class="topic-grid" id="topic-grid"></div>

  <script type="text/javascript">
    const TOPICS = [
      { id: "getting-started", title: "Getting Started", subtitle: "What is programming? Meet Python, and run your first line of code.", href: "session1.html", available: true },
      { id: "variables-input", title: "Storing Information", subtitle: "Variables, and getting input from the person using your program.", href: "session2.html", available: true },
      { id: "decisions", title: "Making Decisions", subtitle: "Using if / elif / else to make a program respond differently.", href: "session3.html", available: true },
      { id: "loops", title: "Repeating Things", subtitle: "For loops and while loops, so you don't repeat yourself.", href: "session4.html", available: true },
      { id: "lists-functions", title: "Organizing Code", subtitle: "Lists, and writing your own reusable functions.", href: "session5.html", available: true },
      { id: "quiz-project", title: "Practice Project", subtitle: "Put it all together and build a simple quiz game.", href: "session6.html", available: true },
    ];

    function renderClientPanel() {
      const panel = document.getElementById("client-panel");
      const active = getActiveClient();

      if (active) {
        panel.innerHTML = `
          <div>Working with: <strong>${active}</strong></div>
          <div class="client-note">Progress is saved on this computer only, under this name. If this client returns and uses a different computer, it won't carry over. Switch to a new name before the next client sits down.</div>
          <br>
          <button class="btn secondary" id="switch-btn">Switch client</button>
        `;
        document.getElementById("switch-btn").addEventListener("click", () => {
          clearActiveClient();
          renderClientPanel();
          renderTopics();
        });
      } else {
        panel.innerHTML = `
          <div><strong>Who's working today?</strong></div>
          <div class="client-note">Type a first name so progress doesn't get mixed up on this shared computer.</div>
          <br>
          <input type="text" id="client-name-input" placeholder="First name">
          <button class="btn" id="start-btn">Start</button>
        `;
        const startSession = () => {
          const input = document.getElementById("client-name-input");
          const name = input.value.trim();
          if (!name) { input.focus(); return; }
          setActiveClient(name);
          renderClientPanel();
          renderTopics();
        };
        document.getElementById("start-btn").addEventListener("click", startSession);
        document.getElementById("client-name-input").addEventListener("keydown", (e) => {
          if (e.key === "Enter") startSession();
        });
      }
    }

    function renderTopics() {
      const grid = document.getElementById("topic-grid");
      grid.innerHTML = "";
      TOPICS.forEach(topic => {
        const complete = isTopicComplete(topic.id);
        const card = document.createElement("div");
        card.className = "topic-card" + (topic.available ? "" : " disabled");
        card.innerHTML = `
          <div>
            <p class="topic-title">${topic.title}</p>
            <p class="topic-subtitle">${topic.subtitle}</p>
            <span class="status ${complete ? "complete" : "not-started"}">${complete ? "Completed" : (topic.available ? "Not started" : "Coming soon")}</span>
          </div>
          ${topic.available
            ? `<a class="open-link" href="${topic.href}">Open</a>`
            : `<span class="open-link disabled">Open</span>`}
        `;
        grid.appendChild(card);
      });
    }

    renderClientPanel();
    renderTopics();
  </script>

</body>

</html>
