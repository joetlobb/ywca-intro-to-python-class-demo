<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyodide NPM Local Runner</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
</head>

<body>
  <textarea name="code" id="code" rows="10" cols="50">print("Hello from local NPM Pyodide script!")
x = 100
y = 200
print(f"Result: {x + y}")</textarea>
  <br>
  <button id="run-btn">Run</button>

  <h3>Output:</h3>
  <pre id="output" style="background: #f0f0f0; padding: 10px; min-height: 50px; border: 1px solid #ccc;"></pre>

  <script type="text/javascript">
    async function main() {
      const outputElement = document.getElementById("output");
      const button = document.getElementById("run-btn");
      const textarea = document.getElementById("code");

      outputElement.textContent = "Loading local Pyodide environment...";

      try {
        // 3. Explicitly point the indexURL to your local folder containing the .wasm assets
        let pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v314.0.6/full/",
          stdout: (text) => {
            outputElement.textContent += text + "\n";
          },
          stderr: (text) => {
            outputElement.textContent += "Error: " + text + "\n";
          }
        });

        outputElement.textContent = "Pyodide Ready via local NPM files. Click 'Run'.\n";

        button.addEventListener("click", async () => {
          outputElement.textContent = ""; // Clear output
          const codeToRun = textarea.value;

          try {
            let result = await pyodide.runPythonAsync(codeToRun);
            if (result !== undefined) {
              outputElement.textContent += `\n[Returned]: ${result}`;
            }
          } catch (err) {
            outputElement.textContent += `\nExecution Error: ${err.message}`;
          }
        });
      } catch (initError) {
        outputElement.textContent = `Initialization Failed: ${initError.message}`;
      }
    }
    main();
  </script>
</body>

</html>
