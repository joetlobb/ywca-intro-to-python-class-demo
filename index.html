<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyodide NPM Local Runner</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
</head>

<body>
  <p id="status"></p>
  <div class="code-runner">
    <textarea class="code-input" rows="10" cols="50">print("Hello, Greenbridge!")</textarea>
    <br>
    <button class="run-btn">Run</button>

    <h3>Output:</h3>
    <pre class="output" style="background: #f0f0f0; padding: 10px; min-height: 50px; border: 1px solid #ccc;"></pre>
  </div>

  <script type="text/javascript">
    let currentOutputEl = null; // tracks which block is currently running, for stdout/input to target

    function browserInput(promptText) {
      const answer = window.prompt(promptText || "");
      const value = answer === null ? "" : answer;
      if (currentOutputEl) currentOutputEl.textContent += `${promptText}${value}\n`;
      return value;
    }

    async function main() {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Loading Python environment...";


      try {
        const pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v314.0.6/full/",
          stdout: (text) => {
            if (currentOutputEl) currentOutputEl.textContent += text + "\n";
          },
          stderr: (text) => {
            if (currentOutputEl) currentOutputEl.textContent += "Error: " + text + "\n";
          }
        });

        pyodide.globals.set("browserInput", browserInput);
        await pyodide.runPythonAsync(`
import builtins
def _input_shim(prompt=""):
    return browserInput(prompt)
builtins.input = _input_shim
`);

        statusEl.textContent = "Ready.";

        document.querySelectorAll(".code-runner").forEach(runner => {
          const textarea = runner.querySelector(".code-input");
          const button = runner.querySelector(".run-btn");
          const output = runner.querySelector(".output");

          button.addEventListener("click", async () => {
            currentOutputEl = output;
            output.textContent = "";
            try {
              await pyodide.runPythonAsync(textarea.value);
            } catch (err) {
              output.textContent += `\nExecution Error: ${err.message}`;
            }
          });
        });

      } catch (initError) {
        statusEl.textContent = `Initialization Failed: ${initError.message}`;
      }
    }

    main();
  </script>
</body>

</html>
